# The dogfight demo on Fly.io (D-114). From the repository's root, once:
#
#   fly launch --no-deploy --copy-config --name <name> --config packages/multiplayer/src/demos/dogfight/fly.toml
#
# then to deploy:
#
#   fly deploy . --ha=false --config packages/multiplayer/src/demos/dogfight/fly.toml --dockerfile packages/multiplayer/src/demos/dogfight/Dockerfile
#
# Rooms live in the server's memory: run exactly one machine (--ha=false; `fly scale count 1` fixes it).
# It stops when idle and wakes on the next visit in a few seconds.

app = "pixelworld-dogfight"
primary_region = "sjc"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
