# Yosemite Valley, walking level (D-136): the valley from Tunnel View to
# Half Dome and Nevada Fall at 10 m per cell, on open data only. El Capitan,
# Bridalveil Fall, Cathedral Rocks, Yosemite Falls, Sentinel Rock, Glacier
# Point, the Royal Arches, North Dome and Half Dome round the Merced River,
# the valley's meadows, Yosemite Village, the Ahwahnee and Curry Village.
# A first cut on the pipeline as it is, to see what the park needs: its
# trees are the client's scatter by WorldCover's classes, its granite the
# `sierra` pack's strata by height.
# Build: cd pipeline && uv run pixelworld build ../worlds/yosemite/valley.yaml
id: yosemite-valley
name: Yosemite Valley (walking)
level: walk
levels:
  - { name: drive, world: yosemite, label: "Driving Yosemite" }
  - { name: walk, world: yosemite-valley, label: "Walking Yosemite Valley" }
bounds: [-119.685, 37.705, -119.520, 37.765] # lon/lat: west, south, east, north (~14.5 × 6.7 km)

metersPerCell: 10
# the walls are 900–1,500 m: drawn true
verticalExaggeration: 1.0
maxSlope: 3
chunkSize: 64
smoothing: null
warp: null

style: sierra
start: { lon: -119.5880, lat: 37.7420 } # Cook's Meadow, under Yosemite Falls

sources:
  # 3DEP's 10 m pixels interpolated onto the 5 m micro-cells, not spread
  # flat over 2 × 2 of them: averaged, the walls came out as fields of cubes (D-118)
  dem: { kind: usgs-3dep-13arcsec, overview: 1, resampling: bilinear }
  landcover: { kind: esa-worldcover-2021, overview: 1 }
  features: { kind: overture, release: 2026-10-21.0 }
  roads:
    classes: [primary, secondary, tertiary, residential, unclassified, service]
    excludeSubclasses: [parking_aisle, driveway]
  paths: { classes: [footway, path, steps, cycleway, pedestrian] }
  rivers: { subtypes: [river, stream] }

geology: { default: sierra-nevada }

# the valley's roads follow the river and the talus: snapped only where
# nearly straight, the rest drawn along their own centre lines (D-082)
snap:
  roads: { angle: 6, directions: 16, simplify: 0.75, maxShift: 2.0 }
  buildings: { angle: 6, follow: 3, clearRoads: { nudgeMeters: 5 } }
widths:
  scale: 1.0
  minCells: 0.15
  centrelines: true

# the walls tilt as faces rather than stepping down in terraces: a
# micro-cell up to 64 micro-steps from corner to corner is still a slope (D-136)
micro: { k: 4, dem: { overview: 1 }, maxSlope: 64 }

# the walls are hundreds of cells of rock: every cell this steep is rock
terrain: { cliffSlope: 0.9, minLakeArea: 2000, maxLakeRelief: 8 }

ground:
  lawn:
    landUse: [meadow, grass, village_green, recreation_ground]
    over: [grass, desert, urban, scrub]
    keep: [beach, sand]
    maxSlope: 0.15
    slopeMeters: 50

objects:
  buildings:
    minArea: 20
    houseMaxArea: 250
  depiction: { heightStretch: 1.0, scatter: 1.0 }
