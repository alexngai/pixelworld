# of the station, on the waterfront: Overture's footprint (尖沙咀鐘樓, 44 m)
# is about 8 m across, centred at 114.169538 E 22.293593 N. A line landmark
# 8 m long through it, 8 m thick, so the kit's tower hall draws the shaft on
# a band as wide as the tower, a low plinth with arched openings at its foot
