# US Southwest, driving level: the whole region on the M2 elastic map.
# Build: cd pipeline && uv run pixelworld build ../worlds/southwest/region.yaml
id: southwest
name: US Southwest
bounds: [-116.0, 35.0, -111.5, 37.5] # lon/lat: west, south, east, north

# Scale levels (D-046): the region is drawn for flying, driving and walking,
# each its own world package. Level specs extend this file and override its
# parameters (fly.yaml, walk.yaml); the client moves between them by lon/lat.
level: drive
levels:
  - { name: fly, world: southwest-fly, label: Flying }
  - { name: drive, world: southwest, label: Driving }
  - { name: walk, world: southwest-walk, label: Walking the Strip }

# Layout and vertical scale (docs/architecture.md §3.2, D-022, D-023).
metersPerCell: 400 # the planned "base" scale; M2 enlarges focus areas
verticalExaggeration: 2.5
maxSlope: 2
chunkSize: 64
smoothing:
  bilateralCells: 1.5
  bilateralMeters: 48

# Elastic map (M2): focus areas and pins live in warp.yaml (edited by apps/editor).
warp: warp.yaml

# Micro-terrain (M1.6, D-037): 4×4 micro-cells (100 m) per cell, heights in
# quarter steps, read from the 60 m overview of the 30 m DEM.
micro:
  k: 4
  dem: { overview: 2 }

# Objects (M2: landmarks, buildings on the Strip). Landmarks are stamped
# rigidly at their mapped anchor; the dam spans its crest line from OSM.
objects:
  buildings: { bounds: [-115.19, 36.08, -115.14, 36.15], minArea: 200, towerMeters: 45, podiumMeters: 18, houseMaxArea: 350 }
  landmarks:
    - { group: landmark.tower.observation, lon: -115.1555, lat: 36.1474, hm: 350, clear: 45 }
    - { group: landmark.sign, lon: -115.17282, lat: 36.08208, clear: 10 }
    - { group: landmark.tower.lookout, lon: -111.8261, lat: 36.0441, hm: 80, clear: 30 }
    - { group: landmark.dam, line: [[-114.73680, 36.01480], [-114.73939, 36.01650]], crestMeters: 376, thicknessM: 45, clear: 60 }

style: desert-southwest
start: { lon: -115.1728, lat: 36.1147 } # Las Vegas Strip

sources:
  dem:
    kind: usgs-3dep-1arcsec
    overview: 4 # read the 120 m overview of the 30 m DEM
  landcover:
    kind: esa-worldcover-2021
    overview: 16 # 160 m overview, mode-resampled per cell
  overture:
    release: 2026-10-21.0
  roads:
    classes: [motorway, trunk, primary, secondary]
  rivers:
    subtypes: [river]

# Geology provinces pick the strata set for cliffs (style pack `provinces`).
# Rough hand-drawn outline of the Colorado Plateau inside this region; the
# Grand Wash Cliffs and the Mogollon Rim are its western and southern edges.
geology:
  default: basin-and-range
  provinces:
    - name: colorado-plateau
      polygon:
        - [-113.95, 37.6]
        - [-113.95, 36.05]
        - [-113.55, 35.75]
        - [-112.9, 35.45]
        - [-112.2, 35.3]
        - [-111.4, 35.15]
        - [-111.4, 37.6]
