# US Southwest, walking level (D-046): the Las Vegas Strip at 20 m per cell,
# uniform (no warp), from the Welcome sign to the observation tower. Built
# from the M1.5 pixel experiment's Strip (worlds/experiment/strip-k8.yaml),
# drawn at full cell size with micro-terrain instead of a render scale.
# Build: cd pipeline && uv run pixelworld build ../worlds/southwest/walk.yaml
extends: region.yaml
id: southwest-walk
name: Las Vegas Strip (walking)
level: walk
bounds: [-115.188, 36.078, -115.148, 36.152]

metersPerCell: 20
verticalExaggeration: 2.5
maxSlope: 3
warp: null
smoothing: null

# 5 m micro-cells from the 10 m DEM; every street (not parking aisles or
# driveways) and the pedestrian network: sidewalks, crosswalks, footways
sources:
  dem: { kind: usgs-3dep-13arcsec, overview: 1 }
  landcover: { kind: esa-worldcover-2021, overview: 1 }
  roads:
    classes: [motorway, trunk, primary, secondary, tertiary, residential, unclassified, living_street, service]
    excludeSubclasses: [parking_aisle, driveway]
    # service roads that only connect through a car park's aisles join the
    # streets through as few aisles as they need (M3.5)
    joinIslands: [parking_aisle]
  paths: { classes: [sidewalk, crosswalk, footway, pedestrian, steps, path, cycleway] }

# true widths (D-050): a 14 m carriageway spans most of a 20 m cell; lane
# counts from each way's width (3.5 m lanes) and a median between the two
# carriageways of a divided road (Las Vegas Boulevard, I-15) (M3.5)
widths: { scale: 1.0, minCells: 0.1, lanes: { meters: 3.5 } }
# buildings the shift leaves over a drawn road move off it, up to 5 m, or
# lose the part over it (M3.5)
snap: { buildings: { clearRoads: { nudgeMeters: 5 } } }
micro: { k: 4, dem: { overview: 1 } }

# keep lakes and big pools (the fountain lake), drop specks
terrain: { minLakeArea: 4000, maxLakeRelief: 6 }

objects:
  buildings:
    minArea: 40
    towerMeters: 45
    podiumMeters: 18
    houseMaxArea: 350
    lidar: { project: USGS_LPC_NV_LasVegas_QL1_2016_LAS_2018, res: 4, depth: 6 }
  vegetation:
    # trees where the canopy height map (WRI/Meta, 1 m) shows 3 m or more
    - { group: tree, canopy: 3, spacing: 9, density: 0.9 }
    - { group: shrub, landcover: [shrub], spacing: 40, density: 0.2 }
  streetTrees:
    - { group: tree.palm, roads: [primary], name: Las Vegas Boulevard, spacing: 70, offset: 24 }
  # street furniture (M3): lights along the main streets, signals at their junctions
  streetProps:
    - { group: prop.streetlight, roads: [primary, secondary, tertiary], spacing: 45, offset: 13 }
    - { group: prop.signal, roads: [primary, secondary, tertiary], at: junctions, offset: 14 }
  landmarks: [strat-tower, welcome-sign, eiffel-replica, high-roller]
  # at walking scale true proportions read best: no extra height stretch;
  # the client scatters shrubs and rocks by surface (M3)
  depiction: { heightStretch: 1.0, scatter: 1.0 }
