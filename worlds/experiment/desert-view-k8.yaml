# M1.5 pixel detail experiment: Desert View, Grand Canyon (docs/roadmap.md).
# Fine cells (20 m) drawn at 1/8 size stand in for micro-terrain K=8 on a
# 160 m/cell layout: each cell is a 4×2 px diamond and one step is 1 px.
# Build: cd pipeline && uv run pixelworld build ../worlds/experiment/desert-view-k8.yaml
id: exp-desert-view-k8
name: Desert View (experiment, K=8)
# The watchtower on the rim (south-east) looking over the river bend (north-west).
bounds: [-111.880, 36.036, -111.818, 36.098] # lon/lat: west, south, east, north
metersPerCell: 20
verticalExaggeration: 2.5
maxSlope: 3
chunkSize: 64
render: { scale: 0.125, tileSize: 512 } # one bake tile for the whole area

style: desert-southwest
start: { lon: -111.8240, lat: 36.0432 } # beside the Desert View Watchtower

sources:
  dem: { kind: usgs-3dep-13arcsec, overview: 1 } # 10 m DEM, averaged to cells
  landcover: { kind: esa-worldcover-2021, overview: 1 }
  features: { kind: overture, release: 2026-10-21.0 }
  roads: { classes: [motorway, trunk, primary, secondary] }
  rivers: { subtypes: [river] }

geology: { default: colorado-plateau }

# Fine-cell terrain rules: steep cells are bare rock whatever the cover, small
# or sloping "water" patches (canyon shadows misread by WorldCover) are dropped,
# and the river gets its real width instead of a one-cell line.
terrain: { cliffSlope: 0.6, minLakeArea: 15000, maxLakeRelief: 12, riverWidthMeters: 80 }

objects:
  buildings: { minArea: 30 }
  vegetation:
    # pinyon-juniper woodland is open: scattered trees with ground between
    - { group: tree.pinyon-juniper, landcover: [tree], spacing: 22, density: 0.45 }
    - { group: tree.pinyon-juniper, landcover: [shrub, grass], spacing: 45, density: 0.2 }
    - { group: shrub, landcover: [shrub, grass, bare], spacing: 35, density: 0.2 }
    - { group: rock.boulder, landcover: [bare], spacing: 50, density: 0.1 }
  landmarks:
    # depicted height: the 21 m tower is caricatured ×4 so it reads at this scale
    - { group: landmark.tower.lookout, lon: -111.8261, lat: 36.0441, hm: 80, clear: 30 }
