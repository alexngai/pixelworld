# Hong Kong, driving level (D-133): both shores of Victoria Harbour at 25 m
# per cell, from Kennedy Town to Lei Yue Mun and from Stanley to Prince
# Edward, on open data only (D-107). What makes it Hong Kong from here is the
# harbour between two walls of towers: Central's and Wan Chai's skyline under
# the Peak, Tsim Sha Tsui's waterfront and the ICC across the water, the
# Star Ferry between them, junks under red sails, and the typhoon shelters
# full of boats. Its walking level is Hong Kong Island's (`hongkong-island`);
# Kowloon's (`hongkong-walk`) links back to it. It shares their neighbourhoods
# and rules.
# Build: cd pipeline && uv run pixelworld build ../worlds/hongkong/region.yaml
id: hongkong
name: Hong Kong
level: drive
levels:
  - { name: drive, world: hongkong, label: "Driving round Victoria Harbour" }
  - { name: walk, world: hongkong-island, label: "Walking Hong Kong Island" }
bounds: [114.105, 22.195, 114.265, 22.338] # lon/lat: west, south, east, north (north past a trunk road's viaduct by Sham Shui Po, which otherwise leaves the edge and comes back)

metersPerCell: 25
verticalExaggeration: 1.5
maxSlope: 3
chunkSize: 64
smoothing: null
warp: null

snap:
  roads: { angle: 6, directions: 16, simplify: 0.75, maxShift: 2.0 }
  buildings: { angle: 6, follow: 3, clearRoads: { nudgeMeters: 5 } }

# streets at 1.5x their real width, so a side street reads; no lane lines at this scale
widths: { scale: 1.5, minCells: 0.1, lanes: { lines: false } }
micro: { k: 2, dem: { overview: 1 }, smooth: { lawn: 15 } }

ground:
  lawn:
    landUse: [park, dog_park, village_green, golf_course, fairway, pitch, recreation_ground, grass, garden, cemetery, grave_yard, meadow]
    over: [grass, desert, urban, farmland]
    keep: [grassland, scrub, heath, beach, sand]
    maxSlope: 0.2
    slopeMeters: 50
    wooded: { over: [woodland], maxCover: 0.5, canopy: 3 }
    spread: { over: [grass], meters: 25 }
  scrub: { over: [woodland], maxCover: 0.3 }

terrain: { minLakeArea: 4000 }

objects:
  buildings:
    minArea: 25
    towerMeters: 80
    podiumMeters: 18
    houseMaxArea: 350
  # the walking levels' rules, both shores' old districts together (D-109, D-117)
  typology:
    rules:
      # Hong Kong's public housing: the blocks on an estate's land, which OSM
      # names for the estate (邨); and the temples, Man Mo, Tin Hau, Hung Shing
      # and Pak Tai, by name (D-134)
      - { group: building.estate, from: [building.tower, building.residential, building.commercial], grounds: [residential], groundHas: ["邨"] }
      - { group: building.temple, from: [building.residential, building.commercial, building.parking], nameHas: ["Temple"], kinds: ["", temple, religious] }
      - { group: building.tower.residential, from: [building.tower], kinds: [apartments, residential, house, dormitory] }
      - { group: building.tower.residential, from: [building.tower], hoods: [Jordan, Yau Ma Tei, Mong Kok, Tai Kok Tsui, Prince Edward, King's Park, Sheung Wan, Sai Ying Pun, Kennedy Town, Wan Chai, Causeway Bay, North Point, Happy Valley, Mid-Levels, Quarry Bay, Shau Kei Wan], maxWidth: 35 }
      - { group: building.podium, floors: [1, 7], minWidth: 40 }
      - { group: building.composite, floors: [10, 24], maxWidth: 35 }
      - { group: building.tonglau, floors: [3, 9], maxWidth: 18, hoods: [Jordan, Yau Ma Tei, Mong Kok, Tai Kok Tsui, Prince Edward, Tsim Sha Tsui, Sheung Wan, Sai Ying Pun, Kennedy Town, Wan Chai, Causeway Bay, North Point, Shau Kei Wan] }
      - { group: building.civic, kinds: [school, college, university, hospital, government, civic, public, religious, church, temple, fire_station, police] }
      - { group: building.village, floors: [1, 4], hoods: [The Peak, Pok Fu Lam, Repulse Bay, Stanley, Shek O] }
      - { group: building.village, floors: [1, 3], maxWidth: 20 }
  vegetation:
    - { group: tree, canopy: 3, landcover: [built, grass, shrub, crop, bare, wetland], spacing: 12, density: 0.9 }
    - group: prop.boat
      water: true
      spacing: 22
      density: 0.45
      bounds: [[114.1805, 22.2845, 114.1895, 22.2895], [114.1460, 22.2435, 114.1660, 22.2490], [114.2240, 22.2800, 114.2330, 22.2860], [114.1590, 22.3050, 114.1650, 22.3150]]
    - { group: prop.boat.junk, water: true, spacing: 400, density: 0.35, bounds: [114.1500, 22.2860, 114.2100, 22.2930] }
  streetTrees:
    - { group: tree.street, roads: [primary, secondary, tertiary], canopy: 3, spacing: 14, kerb: 1.2 }
  # new ones go at the end: a landmark's seed is its place in the list
  landmarks: [international-commerce-centre, tsim-sha-tsui-clock-tower, hong-kong-cultural-centre, the-peninsula, two-international-finance-centre, bank-of-china-tower, central-plaza, hong-kong-convention-and-exhibition-centre, hopewell-centre]
  landmarkDepiction: generic
  depiction: { heightStretch: 1.0, scatter: 1.0 }

style: hongkong
start: { lon: 114.1690, lat: 22.2900 } # mid-harbour, between the Star Ferry's piers

sources:
  # Copernicus GLO-30 with buildings filtered off in town (D-107, D-115), interpolated (D-132)
  dem: { kind: copernicus-glo30-ground, overview: 1, resampling: bilinear }
  landcover: { kind: esa-worldcover-2021, overview: 1 }
  features: { kind: overture, release: 2026-10-21.0 }
  facts:
    kind: areas
    areas:
      - { hood: Central, bounds: [114.1530, 22.2785, 114.1630, 22.2930], floors: 8 }
      - { hood: Mid-Levels, bounds: [114.1400, 22.2720, 114.1630, 22.2835], floors: 15 }
      - { hood: The Peak, bounds: [114.1350, 22.2550, 114.1650, 22.2720], floors: 4 }
      - { hood: Kennedy Town, bounds: [114.1050, 22.2760, 114.1350, 22.2930], floors: 12 }
      - { hood: Sai Ying Pun, bounds: [114.1350, 22.2835, 114.1460, 22.2930], floors: 6 }
      - { hood: Sheung Wan, bounds: [114.1460, 22.2835, 114.1560, 22.2930], floors: 6 }
      - { hood: Admiralty, bounds: [114.1630, 22.2740, 114.1700, 22.2900], floors: 7 }
      - { hood: Wan Chai, bounds: [114.1700, 22.2720, 114.1810, 22.2900], floors: 13 }
      - { hood: Causeway Bay, bounds: [114.1810, 22.2740, 114.1920, 22.2900], floors: 6 }
      - { hood: Happy Valley, bounds: [114.1760, 22.2580, 114.1950, 22.2740], floors: 10 }
      - { hood: North Point, bounds: [114.1920, 22.2800, 114.2070, 22.2930], floors: 20 }
      - { hood: Quarry Bay, bounds: [114.2070, 22.2780, 114.2230, 22.2930], floors: 6 }
      - { hood: Shau Kei Wan, bounds: [114.2230, 22.2700, 114.2360, 22.2870], floors: 10 }
      - { hood: Chai Wan, bounds: [114.2360, 22.2550, 114.2550, 22.2850], floors: 7 }
      - { hood: Pok Fu Lam, bounds: [114.1200, 22.2450, 114.1400, 22.2760], floors: 4 }
      - { hood: Aberdeen, bounds: [114.1400, 22.2430, 114.1760, 22.2580], floors: 6 }
      - { hood: Ap Lei Chau, bounds: [114.1400, 22.2320, 114.1620, 22.2430], floors: 16 }
      - { hood: Repulse Bay, bounds: [114.1760, 22.2250, 114.2050, 22.2500], floors: 6 }
      - { hood: Stanley, bounds: [114.2000, 22.1950, 114.2300, 22.2250], floors: 4 }
      - { hood: Shek O, bounds: [114.2400, 22.2150, 114.2650, 22.2400], floors: 2 }
      - { hood: Tsim Sha Tsui, bounds: [114.167, 22.290, 114.178, 22.303], floors: 9 }
      - { hood: Jordan, bounds: [114.166, 22.303, 114.174, 22.309], floors: 6 }
      - { hood: Yau Ma Tei, bounds: [114.166, 22.309, 114.174, 22.316], floors: 6 }
      - { hood: Mong Kok, bounds: [114.164, 22.316, 114.175, 22.326], floors: 8 }
      - { hood: Tai Kok Tsui, bounds: [114.156, 22.316, 114.164, 22.326], floors: 6 }
      - { hood: Prince Edward, bounds: [114.156, 22.326, 114.178, 22.330], floors: 7 }
      - { hood: King's Park, bounds: [114.174, 22.303, 114.178, 22.316], floors: 8 }
      - { hood: West Kowloon, bounds: [114.156, 22.290, 114.166, 22.316], floors: 4 }
  roads:
    classes: [motorway, trunk, primary, secondary, tertiary, residential, unclassified, living_street, service]
    excludeSubclasses: [parking_aisle, driveway]
    joinIslands: [parking_aisle]
  paths: { classes: [footway, pedestrian, steps, path] }
  rivers:
    subtypes: [river]
  rails:
    - { draw: street, rail: [tram] }
    - { draw: train, rail: [standard_gauge, narrow_gauge, subway, light_rail, funicular], bundle: 20 }

geology: null
