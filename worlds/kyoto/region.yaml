# Kyoto, driving level (D-095): the city centre at 25 m per cell, from
# Kinkaku-ji in the north-west to Tō-ji and Fushimi Inari's gate in the south
# and Ginkaku-ji in the east: Nijō Castle, the Imperial Palace, the Kamo
# river, Heian Shrine's great torii and the Higashiyama hills. The walking
# level (walk.yaml) is Gion and Higashiyama at 10 m; the flying level
# (fly.yaml) the whole basin at 100 m.
# Build: cd pipeline && uv run pixelworld build ../worlds/kyoto/region.yaml
id: kyoto
name: Kyoto
bounds: [135.725, 34.960, 135.805, 35.045] # lon/lat: west, south, east, north

level: drive
levels:
  - { name: fly, world: kyoto-fly, label: Flying over the Kyoto basin }
  - { name: drive, world: kyoto, label: Driving central Kyoto }
  - { name: walk, world: kyoto-walk, label: Walking Gion and Higashiyama }

metersPerCell: 25
# the Higashiyama and Kitayama hills rise 200 m over the basin floor
verticalExaggeration: 1.5
maxSlope: 3
chunkSize: 64
smoothing: null
warp: null

# the Heian grid snaps within 6 degrees to the 16 directions (D-049, D-082)
snap:
  roads: { angle: 6, directions: 16, simplify: 0.75, maxShift: 2.0 }
  buildings: { angle: 6, follow: 3 }

widths: { scale: 1.5, minCells: 0.1, centrelines: true, lanes: { lines: false } }
micro: { k: 4, dem: { overview: 4 }, smooth: { lawn: 15 } } # GSI read at 4 m, as the walking level

ground:
  lawn:
    landUse: [park, dog_park, village_green, golf_course, fairway, green, tee, rough, pitch, recreation_ground, grass, garden, cemetery, grave_yard, meadow]
    over: [grass, desert, urban, farmland]
    keep: [grassland, scrub, heath, beach, sand]
    maxSlope: 0.2
    slopeMeters: 50
    wooded: { over: [woodland], maxCover: 0.5, canopy: 3 }
    spread: { over: [grass], meters: 25 }
    # a park's courts and plazas stay paved: the Imperial Palace's gravel courts (D-097)
    paved: [pedestrian]

terrain: { minLakeArea: 4000 }

objects:
  buildings:
    minArea: 30
    towerMeters: 45
    podiumMeters: 18
    houseMaxArea: 350
  # the walking level's typology (D-091, D-094); see walk.yaml for the reasons
  typology:
    facts: { plugin: plateau, year: 2025 }
    roofHints: true
    rules:
      # Nijō Castle's two palaces and gates, and the Imperial Palace's halls and
      # gates, by their names (D-096): PLATEAU has no models of the Imperial
      # Palace, and Nijō's halls carry the code of temples and schools (422);
      # `from` types their parts too (the 紫宸殿 is drawn in parts)
      - { group: building.palace, names: [遠侍, 式台, 大広間, 蘇鉄の間, 黒書院, 白書院, 御清所, 台所, 雁の間, 唐門, 東大手門, 北大手門, 桃山門, 鳴子門, 東南隅櫓, 西南隅櫓, 米倉, 本丸御殿, 玄関], from: [building.residential, building.commercial, building.parking, building.tower] }
      - { group: building.palace.gosho, names: [紫宸殿, 清涼殿, 小御所, 御学問所, 常御殿, 御常御殿, 春興殿, 飛香舎, 参内殿, 皇后宮常御殿, 御花御殿, 御三間, 御涼所, 諸大夫の間, 御車寄, 新御車寄, 建礼門, 建春門, 承明門, 日華門, 月華門, 宜秋門, 朔平門, 皇后門, 清所門], from: [building.residential, building.commercial, building.parking, building.tower] }
      # the Imperial Palace's covered corridors, unnamed: narrow, long and low inside
      # the Gyoen park (D-097)
      - { group: building.palace.gosho, grounds: [park], minWidth: 3, maxWidth: 7, minDepth: 25, maxHeight: 12 }
      # Buddhist halls by their names, whatever OSM's class: it tags many of them
      # building=shrine (Kiyomizu-dera's and Tō-ji's main halls among them) (D-094)
      - { group: building.temple, names: [本堂, 金堂, 講堂, 食堂, 御影堂, 阿弥陀堂, 開山堂, 法堂, 仏殿, 観音堂, 釈迦堂, 不動堂, 大師堂, 地蔵堂, 薬師堂, 太子堂, 経蔵, 鐘楼, 山門, 三門, 方丈, 庫裏, 宝蔵] }
      - { group: building.shrine, kinds: [shrine] }
      - { group: building.temple, kinds: [roof], classes: ["422"] }
      - { group: building.temple, kinds: [temple] }
      - { group: building.temple, classes: ["422"], roofs: [hipped] }
      - { group: building.temple, materials: [wood], roofs: [hipped], minWidth: 12 }
      - { group: building.temple, grounds: [religious], roofs: [gabled, hipped], maxHeight: 25 }
      - { group: building.kura, classes: ["431"], materials: [wood], floors: [1, 2] }
      - { group: building.machiya, materials: [wood], year: [1000, 1950], floors: [1, 2], maxWidth: 10, classes: ["41*", "461"] }
      - { group: building.house, materials: [wood], roofs: [hipped], floors: [1, 3] }
      - { group: building.house.gabled, materials: [wood], floors: [1, 3] }
      - { group: building.midrise, floors: [3, 14] }
  vegetation:
    - { group: tree, canopy: 3, spacing: 16, density: 0.9 }
  streetTrees:
    - { group: tree.street, roads: [tertiary, secondary, primary], canopy: 3, spacing: 16, kerb: 2, offset: 9 }
  # new ones go at the end: a landmark's seed is its place in the list
  landmarks:
    - kiyomizu-dera-hondo
    - yasaka-pagoda
    - yasaka-shrine-west-gate
    - chion-in-sanmon
    - kyoto-tower
    - kiyomizu-dera-pagoda
    - toji-pagoda
    - heian-jingu-otorii
    - kinkaku-ji
  landmarkDepiction: generic
  depiction: { heightStretch: 1.5, scatter: 1.0 }

style: kyoto
start: { lon: 135.7593, lat: 34.9880 } # Karasuma-dōri by Kyoto Tower

sources:
  dem: { kind: gsi-dem, overview: 4 }
  landcover: { kind: esa-worldcover-2021, overview: 1 }
  overture:
    release: 2026-10-21.0
  roads:
    classes: [motorway, trunk, primary, secondary, tertiary, residential, unclassified, living_street]
  rivers:
    subtypes: [river, canal]
  # ponds and moats from Overture as still water: Kinkaku-ji's pond, Nijō Castle's moats (D-097)
  lakes: { classes: [pond, moat, lake, reservoir] }
  rails:
    - { draw: train, rail: [standard_gauge, narrow_gauge] }

geology: null
