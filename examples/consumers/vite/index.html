<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pixelworld from npm · Vite</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1c2b;
        color: #e8dcbc;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
      }
      #status {
        position: fixed;
        left: 8px;
        bottom: 8px;
        padding: 4px 8px;
        border-radius: 4px;
        background: rgba(20, 19, 32, 0.78);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="status">loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
