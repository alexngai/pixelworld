[project]
name = "pixelworld-city-sf"
license = "MIT OR Apache-2.0"
version = "0.0.0"
description = "San Francisco city pack for the pixelworld pipeline: DataSF building facts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pixelworld-pipeline",
  "rasterio>=1.4",
  "shapely>=2.2.0",
]

# What the pack adds to the pipeline (docs/plugins.md): the spec names it with
# `objects.typology.facts: datasf`.
[project.entry-points."pixelworld.facts"]
datasf = "pixelworld_city_sf.datasf:DataSFFacts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelworld_city_sf"]

[tool.uv.sources]
pixelworld-pipeline = { workspace = true }
