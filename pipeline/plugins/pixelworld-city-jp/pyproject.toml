[project]
name = "pixelworld-city-jp"
license = "MIT OR Apache-2.0"
version = "0.0.0"
description = "Japan city pack for the pixelworld pipeline: PLATEAU building facts, GSI elevation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pixelworld-pipeline",
  "rasterio>=1.4",
  "shapely>=2.2.0",
]

# What the pack adds to the pipeline (docs/plugins.md): the spec names them with
# `objects.typology.facts: plateau` and `sources.dem.kind: gsi-dem`.
[project.entry-points."pixelworld.facts"]
plateau = "pixelworld_city_jp.plateau:PlateauFacts"

[project.entry-points."pixelworld.sources"]
gsi-dem = "pixelworld_city_jp.gsi:GSI_DEM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelworld_city_jp"]

[tool.uv.sources]
pixelworld-pipeline = { workspace = true }
