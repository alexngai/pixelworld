[project]
name = "pixelworld-city-paris"
license = "MIT OR Apache-2.0"
version = "0.0.0"
description = "Paris city pack for the pixelworld pipeline: APUR and IGN building facts, IGN elevation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pixelworld-pipeline",
  "rasterio>=1.4",
  "shapely>=2.2.0",
]

# What the pack adds to the pipeline (docs/plugins.md): the spec names them with
# `objects.typology.facts: apur` and `sources.dem.kind: ign-rgealti` (or
# `ign-lidar-hd-mnt`).
[project.entry-points."pixelworld.facts"]
apur = "pixelworld_city_paris.apur:ApurFacts"

[project.entry-points."pixelworld.sources"]
ign-rgealti = "pixelworld_city_paris.ign:RGE_ALTI"
ign-lidar-hd-mnt = "pixelworld_city_paris.ign:LIDAR_HD_MNT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelworld_city_paris"]

[tool.uv.sources]
pixelworld-pipeline = { workspace = true }
