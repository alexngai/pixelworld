[project]
name = "pixelworld-city-nyc"
license = "MIT OR Apache-2.0"
version = "0.0.0"
description = "New York City city pack for the pixelworld pipeline: NYC Open Data building facts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pixelworld-pipeline",
  "rasterio>=1.4",
  "shapely>=2.2.0",
]

# What the pack adds to the pipeline (docs/plugins.md): the spec names it with
# `objects.typology.facts: pluto`.
[project.entry-points."pixelworld.facts"]
pluto = "pixelworld_city_nyc.pluto:PlutoFacts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelworld_city_nyc"]

[tool.uv.sources]
pixelworld-pipeline = { workspace = true }
