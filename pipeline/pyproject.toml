[project]
name = "pixelworld-pipeline"
version = "0.0.0"
description = "Offline geo pipeline for Pixelworld: real data -> gridded world packages."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pyarrow>=26.0.1",
  "pyyaml>=6.0.3",
  "rasterio>=1.4",
  "scipy>=1.18.1",
  "shapely>=2.2.0",
]

[project.scripts]
pixelworld = "pixelworld_pipeline.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelworld_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
