name: CI

on:
  # main on push; any other branch through its pull request, so a branch with
  # an open PR is checked once per push, not twice
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web (lint, typecheck, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  web-e2e:
    # The Playwright suite (golden images and behaviour, playwright.config.ts) in
    # shards; Playwright splits the tests by count, in file order. Each shard
    # writes a blob report, merged into one HTML report by web-e2e-report.
    name: Web e2e (golden images, behaviour) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  web-e2e-report:
    name: Web e2e report (merged)
    if: ${{ !cancelled() }}
    needs: web-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  package:
    # The npm packages (docs/npm.md): `pixelworld` and the city packs
    # `@pixelworlds/city-*` (D-074). Builds and packs them and checks the
    # tarballs on every push; release.yml publishes them (no tokens here).
    name: npm packages (build, pack, size, consumers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack (builds dist/ first)
        run: pnpm --filter pixelworld --filter "@pixelworlds/city-*" pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Tarball contents, manifest and size budgets
        run: node tools/pack-check.mjs "$RUNNER_TEMP"/pack/pixelworld-*.tgz
      - name: City pack tarballs (manifest, peer, self-contained worker module)
        run: node tools/city-pack-check.mjs "$RUNNER_TEMP"/pack/pixelworlds-city-*.tgz
      - name: Bundle size budgets (size-limit, gzipped)
        run: pnpm package:size
      - name: API reference
        run: pnpm docs:api
      - run: pnpm exec playwright install --with-deps chromium
      - name: Consumers outside the workspace (Vite dev and build, webpack 5, plain ESM; the Grand Canyon, and San Francisco with its city pack)
        run: >-
          node tools/consumers.mjs --out "$RUNNER_TEMP/consumers"
          --tarball "$RUNNER_TEMP"/pack/pixelworld-*.tgz
          --city-tarball "$RUNNER_TEMP"/pack/pixelworlds-city-sf-*.tgz
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelworld-npm
          path: |
            ${{ runner.temp }}/pack/*.tgz
            ${{ runner.temp }}/consumers/screenshots/
          retention-days: 7

  pipeline:
    name: Pipeline (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
