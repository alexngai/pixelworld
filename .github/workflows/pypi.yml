name: PyPI

# pixelworld-pipeline's releases (docs/npm.md §9, D-129). Pushing a tag
# `pipeline-v<version>`, naming pipeline/pyproject.toml's version, builds the
# sdist and the wheel, checks the wheel on its own, and publishes both through
# PyPI's trusted publishing (OIDC), with attestations (D-130). No PyPI token is
# stored anywhere; the project's trusted publisher on pypi.org names this file
# and the environment `pypi`. id-token only on publish.

on:
  push:
    tags: ["pipeline-v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: The tag names the version being released
        run: test "pipeline-v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv build --out-dir dist
      - name: The wheel alone lists every built-in source by role
        run: uv run --no-project --isolated --with dist/pixelworld_pipeline-*.whl pixelworld plugins
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: pipeline/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pixelworld-pipeline
    permissions:
      id-token: write # PyPI trusted publishing and the attestations' signatures
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
